name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Django tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # Mirrors the local dev setup from the README: DEBUG=True so the app
        # runs on SQLite with no extra services to provision, no secrets
        # needed. The "fail closed in production" checks in
        # config/env_checks.py are covered by their own unit tests instead
        # (config/tests/test_env_checks.py), which exercise the DEBUG=False
        # path directly without booting the whole project that way.
        env:
          DJANGO_DEBUG: "True"
        run: python manage.py test -v 2

  frontend:
    name: Frontend (build + lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run

      - name: Type-check + build
        run: npm run build
