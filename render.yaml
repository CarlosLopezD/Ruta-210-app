services:
  - type: web
    name: eld-trip-planner-api-wkzt
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "eld-trip-planner-api-wkzt.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ruta-210-app.lcarlosdario2020.workers.dev"
      # Free Postgres (Render's own free DB expires after ~30 days — use an
      # external provider such as Neon or Supabase and paste the connection
      # string here from the Render dashboard after the blueprint is created).
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.15"
      # Used to build the links inside verification/reset emails.
      - key: FRONTEND_URL
        value: "https://ruta-210-app.lcarlosdario2020.workers.dev"
      # Resend API key (resend.com) for sending those emails — paste yours
      # in the Render dashboard after the blueprint is created. Without it,
      # emails are logged instead of sent (see backend/accounts/emails.py),
      # so nothing breaks, but users won't actually receive them.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Ruta 210 App <onboarding@resend.dev>"
      # Shared secret for POST /api/system/reset-demo/ (see backend/config/views.py)
      # — a scheduled GitHub Actions workflow calls it every 30 min to wipe the
      # demo database. Render generates a random value; copy it from the
      # dashboard into this repo's GitHub secret also named DEMO_RESET_TOKEN
      # (Settings → Secrets and variables → Actions) so the workflow can send it.
      - key: DEMO_RESET_TOKEN
        generateValue: true
